services:
  - type: web
    name: case-rush
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: case-rush-postgres
          property: connectionString
      - key: NODE_ENV
        value: production
      - key: CRON_SECRET
        generateValue: true
databases:
  - name: case-rush-postgres
    databaseName: case_rush
    user: case_rush
    plan: free
