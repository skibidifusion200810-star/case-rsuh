name: Verify CASE RUSH build
on:
  push:
    branches: [main]
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: package.json
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Verify TypeScript and Next.js build
        env:
          DATABASE_URL: postgresql://test:test@localhost:5432/case_rush
        run: npm run build
